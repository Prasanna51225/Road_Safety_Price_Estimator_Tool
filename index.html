<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Safety AI Estimator | Hackathon 2025</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 15s ease-in-out infinite;
            z-index: 0;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ffd700, transparent);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00d4ff, transparent);
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ff00ff, transparent);
            top: 50%;
            left: 50%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        /* Scanning Line Effect */
        .scan-line {
            position: fixed;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            top: 0;
            animation: scan 4s linear infinite;
            z-index: 0;
            opacity: 0.3;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Container */
        .container {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            box-shadow: 
                0 0 80px rgba(255, 215, 0, 0.3),
                0 0 40px rgba(0, 212, 255, 0.2),
                inset 0 0 60px rgba(255, 215, 0, 0.05);
            max-width: 750px;
            width: 100%;
            padding: 60px;
            animation: containerGlow 3s ease-in-out infinite alternate;
            position: relative;
            z-index: 1;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.3), 0 0 40px rgba(0, 212, 255, 0.2); }
            100% { box-shadow: 0 0 120px rgba(255, 215, 0, 0.4), 0 0 60px rgba(0, 212, 255, 0.3); }
        }

        /* Corner Decorations */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #ffd700;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ffd700);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { filter: drop-shadow(0 0 10px #ffd700); }
            to { filter: drop-shadow(0 0 20px #ffd700); }
        }

        .subtitle {
            color: #00d4ff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.5);
            animation: badgePulse 2s infinite;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 5px 25px rgba(255, 215, 0, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 10px 40px rgba(255, 215, 0, 0.7); }
        }

        /* Stats Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: left 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
        }

        .stat-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .stat-label {
            font-size: 11px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Upload Area */
        .upload-area {
            border: 3px dashed rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 60px 30px;
            text-align: center;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.03) 0%, rgba(0, 212, 255, 0.03) 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, #ffd700, transparent 30%);
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .upload-area:hover::before {
            opacity: 0.1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .upload-area:hover {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(0, 212, 255, 0.08) 100%);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3);
        }

        .upload-area.dragging {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(0, 212, 255, 0.15) 100%);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        .upload-icon {
            font-size: 70px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px #ffd700);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .upload-text {
            font-family: 'Orbitron', sans-serif;
            color: #ffd700;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .upload-hint {
            color: #00d4ff;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        /* File Info */
        .file-info {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 255, 135, 0.1) 100%);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            display: none;
            animation: slideInLeft 0.5s ease;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .file-info.show {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-name {
            color: #00d4ff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            border: 2px solid #ffd700;
            border-radius: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.5);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.7);
        }

        .btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #333 0%, #222 100%);
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 25px;
            display: none;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700 0%, #ff8c00 50%, #ffd700 100%);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.3s ease;
            animation: progressGlow 2s infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        @keyframes progressGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Loader */
        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 215, 0, 0.2);
            border-top: 6px solid #ffd700;
            border-right: 6px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
            display: none;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Status */
        .status {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            display: none;
            animation: statusSlide 0.5s ease;
            border: 2px solid;
        }

        @keyframes statusSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status.info {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .status.success {
            background: rgba(0, 255, 135, 0.1);
            color: #00ff87;
            border-color: rgba(0, 255, 135, 0.5);
            box-shadow: 0 5px 20px rgba(0, 255, 135, 0.3);
        }

        .status.error {
            background: rgba(255, 0, 100, 0.1);
            color: #ff0064;
            border-color: rgba(255, 0, 100, 0.5);
            box-shadow: 0 5px 20px rgba(255, 0, 100, 0.3);
        }

        /* Features */
        .features {
            margin-top: 50px;
            padding-top: 40px;
            border-top: 2px solid rgba(255, 215, 0, 0.2);
        }

        .features-title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #ffd700;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05) 0%, rgba(0, 212, 255, 0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .feature:hover {
            transform: translateX(10px);
            border-color: #ffd700;
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(0, 212, 255, 0.1) 100%);
        }

        .feature-icon {
            font-size: 32px;
            margin-right: 20px;
            color: #ffd700;
            min-width: 50px;
            text-align: center;
            filter: drop-shadow(0 0 10px #ffd700);
        }

        .feature-text {
            color: #00d4ff;
            font-size: 15px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 40px 30px; }
            .header h1 { font-size: 32px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="scan-line"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <!-- Corner Decorations -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Header -->
        <div class="header">
            <h1>Road Safety AI</h1>
            <p class="subtitle">Next-Gen Cost Estimation Platform</p>
            <span class="badge">🏆 NATIONAL HACKATHON 2025</span>
        </div>

    

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">DROP PDF REPORT HERE</div>
            <div class="upload-hint">Or click to select file • Max 10MB</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <!-- File Info -->
        <div class="file-info" id="fileInfo">
            <div class="file-name">
                <i class="fas fa-file-pdf" style="font-size: 24px;"></i>
                <span id="fileName"></span>
            </div>
            <i class="fas fa-check-circle" style="color: #00ff87; font-size: 24px;"></i>
        </div>

        <!-- Button -->
        <button class="btn" id="uploadBtn" disabled>
            <i class="fas fa-rocket"></i> Generate Estimate
        </button>

        <!-- Progress -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader"></div>

        <!-- Status -->
        <div class="status" id="status"></div>

        <!-- Features -->
        <div class="features">
            <div class="features-title">⚡ Powered By Advanced AI</div>
            
            <div class="feature">
                <div class="feature-icon"><i class="fas fa-brain"></i></div>
                <div class="feature-text">Neural Network-Based Intervention Detection</div>
            </div>
            
            
            <div class="feature">
                <div class="feature-icon"><i class="fas fa-shield-alt"></i></div>
                <div class="feature-text">CPWD & GeM Compliant Pricing Standards</div>
            </div>
            
            <div class="feature">
                <div class="feature-icon"><i class="fas fa-file-pdf"></i></div>
                <div class="feature-text">Professional PDF Report Generation</div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            handleFileSelect(e.dataTransfer.files[0]);
        });

        function handleFileSelect(file) {
            if (file && file.type === 'application/pdf') {
                selectedFile = file;
                fileName.textContent = file.name;
                fileInfo.classList.add('show');
                uploadBtn.disabled = false;
                showStatus('<i class="fas fa-check-circle"></i> FILE LOADED: ' + file.name.toUpperCase(), 'info');
            } else {
                showStatus('<i class="fas fa-exclamation-triangle"></i> INVALID FILE FORMAT', 'error');
            }
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PROCESSING...';
            loader.style.display = 'block';
            progressBar.style.display = 'block';
            showStatus('<i class="fas fa-cog fa-spin"></i> ANALYZING REPORT...', 'info');

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 5;
                if (progress <= 90) progressFill.style.width = progress + '%';
            }, 200);

            try {
                const response = await fetch('/upload-report/', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressFill.style.width = '100%';

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `cost_estimate_${selectedFile.name.replace('.pdf', '')}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    showStatus('<i class="fas fa-check-circle"></i> SUCCESS! REPORT DOWNLOADED', 'success');
                } else {
                    const error = await response.json();
                    showStatus('<i class="fas fa-times-circle"></i> ERROR: ' + (error.detail || 'PROCESSING FAILED').toUpperCase(), 'error');
                }
            } catch (error) {
                clearInterval(progressInterval);
                showStatus('<i class="fas fa-exclamation-circle"></i> NETWORK ERROR: ' + error.message.toUpperCase(), 'error');
            } finally {
                loader.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-rocket"></i> GENERATE ESTIMATE';
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 2000);
            }
        });

        function showStatus(message, type) {
            status.innerHTML = message;
            status.className = 'status ' + type;
        }
    </script>
</body>
</html>
